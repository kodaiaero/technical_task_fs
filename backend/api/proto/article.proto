edition = "2023";

package sliide.services.articles.api;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sliide/articles-backend/pkg/articles/api;articlesapi";

// Article is the list-shaped view of an article. It deliberately omits the
// body, which is only served by GetArticleDetails.
message Article {
  string id = 1;
  string title = 2;
  string summary = 3;

  // Path relative to the image CDN's base URL, for example
  // "/articles/technology-01.svg". The host is configuration, not data.
  string image_path = 4;

  string author = 5;
  string source = 6;
  string category = 7;
  google.protobuf.Timestamp published_at = 8;

  // Disabled articles are not served to users. The flag is applied
  // asynchronously, so it reflects the last state that was applied, not
  // necessarily the most recent request.
  bool disabled = 9;
}

message ArticleDetails {
  Article article = 1;
  string body = 2;
}
