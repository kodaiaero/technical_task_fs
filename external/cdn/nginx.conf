# Stands in for the CDN that serves article images.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;

    # Images are immutable: a new image gets a new path.
    location /articles/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
