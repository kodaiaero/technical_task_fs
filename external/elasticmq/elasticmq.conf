# ElasticMQ is an SQS-compatible queue server. In production this queue is a real
# AWS SQS queue owned by the platform team; here it runs locally so the whole
# stack starts with one command.
#
# You are not expected to change this file. The one exception is the `delay`
# below, which controls how long a published message waits before the consumer
# can see it - turn it up or down while you are testing.

include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  article-status-changes {
    defaultVisibilityTimeout = 30 seconds
    delay = 5 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "article-status-changes-dead-letters"
      maxReceiveCount = 3
    }
  }

  article-status-changes-dead-letters { }
}
