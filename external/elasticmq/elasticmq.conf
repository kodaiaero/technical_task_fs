# ElasticMQ is an SQS-compatible queue server, standing in for a managed queue
# so the whole stack starts with one command.
#
# You are not expected to change this file. If you want a longer delay while
# testing, use `make queue-delay DELAY=30` instead - it applies immediately and
# does not need a restart. The `delay` below is the value it resets to.

include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  article-status-changes {
    defaultVisibilityTimeout = 30 seconds
    delay = 5 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "article-status-changes-dead-letters"
      maxReceiveCount = 3
    }
  }

  article-status-changes-dead-letters { }
}
